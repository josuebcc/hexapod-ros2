web_panel:
  ros__parameters:
    web_port: 8080

    motion:
      cmd_vel_rate_hz: 10.0
      max_step_x_mm: 120.0
      max_step_y_mm: 50.0
      max_yaw_step_rad: 0.35

    posture:
      roll_deg:
        min: -20
        max: 20
        step: 1
      pitch_deg:
        min: -20
        max: 20
        step: 1
      yaw_deg:
        min: -25
        max: 25
        step: 1
      x_mm:
        min: -40
        max: 40
        step: 1
      y_mm:
        min: -40
        max: 40
        step: 1
      z_mm:
        min: -50
        max: 50
        step: 1
