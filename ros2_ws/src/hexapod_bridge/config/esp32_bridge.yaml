esp32_bridge:
  ros__parameters:
    port: "/dev/ttyAMA0"
    baud: 115200
    startup_mode: 1

    # Configuración inicial de la marcha.
    current_period: 2.0
    step_height_mm: 30.0
    # Menor latencia para que el evitador pueda corregir el rumbo en interior.
    smoothing_time: 0.5

    # Parada si deja de renovarse el comando de velocidad.
    cmd_vel_timeout_s: 1.0

    # Recorrido máximo usado para calcular los límites de velocidad.
    max_step_x_mm: 120.0
    max_step_y_mm: 50.0
    max_yaw_step_rad: 0.35
